[project]
name = "odds-arena"
version = "0.1.0"
description = "Pit decision models against Polymarket questions and compare their scores."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "cryptography>=42",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odds-arena = "odds_arena.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odds_arena*"]

[tool.setuptools.package-data]
"odds_arena.web" = ["static/*"]

[tool.vercel]
entrypoint = "odds_arena.web.app:app"
